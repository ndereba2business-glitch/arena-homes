    <!-- Arms scroll reveals before first paint; falls back to showing everything if the app hasn't booted within 4 s. -->
    <script>
      ;(function () {
        var d = document.documentElement
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
        d.classList.add('reveal-armed')
        setTimeout(function () {
          if (!window.__ahReveal) d.classList.remove('reveal-armed')
        }, 4000)
      })()
    </script>
